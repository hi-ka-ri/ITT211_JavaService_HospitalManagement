services:
  mysql:
    image: mysql:8.0
    container_name: hospital_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 12345$
      MYSQL_DATABASE: hospital_management_api_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345$"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hospital-network

  redis:
    image: redis:7-alpine
    container_name: hospital_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: hospital_management_api_db
      DB_USERNAME: root
      DB_PASSWORD: 12345$
      DB_URL: jdbc:mysql://mysql:3306/hospital_management_api_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - hospital_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hospital-network

volumes:
  mysql_data:
  redis_data:
  hospital_uploads:

networks:
  hospital-network:
    driver: bridge
